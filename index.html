<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1E3A8A">
  <title>市場均衡與供需調整｜課堂互動</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root{--navy:#1E3A8A;--green:#10B981;--ink:#172554;--muted:#64748b;--line:#dbe4f0;--paper:#f5f8fc}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:#172033;font-family:Inter,"Noto Sans TC",system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,select{font:inherit} button{touch-action:manipulation}.app-shell{min-height:100dvh}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 8px 30px rgba(30,58,138,.06)}
    .btn{min-height:46px;padding:.72rem 1rem;border-radius:12px;font-weight:700;transition:.16s;display:inline-flex;align-items:center;justify-content:center;gap:.45rem}
    .btn-primary{background:var(--navy);color:#fff}.btn-primary:hover{background:#172e70}.btn-green{background:var(--green);color:#052e25}.btn-green:hover{background:#34d399}.btn-light{background:#eef2ff;color:var(--navy)}.btn-danger{background:#fff1f2;color:#be123c}.btn:disabled{opacity:.48;cursor:not-allowed}
    .field{width:100%;min-height:46px;border:1px solid #cbd5e1;border-radius:11px;padding:.7rem .85rem;background:white;outline:none}.field:focus{border-color:#3b82f6;box-shadow:0 0 0 3px #3b82f633}
    .pill{display:inline-flex;align-items:center;border-radius:999px;padding:.28rem .65rem;font-size:.78rem;font-weight:700;background:#eff6ff;color:#1d4ed8}.pill-green{background:#dcfce7;color:#047857}.pill-amber{background:#fef3c7;color:#92400e}
    .topbar{background:linear-gradient(110deg,#1E3A8A,#244ca7);color:#fff}.graph-wrap{position:relative;width:100%;min-height:260px}.graph-canvas{width:100%;height:clamp(260px,48vw,440px);display:block}.thumb-canvas{width:100%;height:120px;display:block;background:#fff;border-radius:8px}.matrix-scroll{overflow-x:auto;padding-bottom:8px}.matrix{display:grid;grid-template-columns:repeat(9,minmax(150px,1fr));gap:10px;min-width:1430px}.matrix-cell{min-height:174px;border:1px dashed #cbd5e1;border-radius:12px;background:#f8fafc;padding:8px}.modal-backdrop{position:fixed;inset:0;background:rgba(15,23,42,.68);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}.modal-box{width:min(1100px,100%);max-height:92dvh;overflow:auto;background:white;border-radius:18px;padding:18px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:80;background:#0f172a;color:#fff;padding:12px 18px;border-radius:12px;box-shadow:0 8px 25px #0003;max-width:90vw}
    .range{accent-color:#10B981;width:100%;min-height:38px}.range.vertical-range{width:clamp(260px,48vw,440px);height:38px;min-height:0;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%) rotate(-90deg);transform-origin:center;touch-action:none;padding:0}.price-control{width:82px;flex:none}.price-range-track{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;height:clamp(260px,48vw,440px);font-size:.72rem;color:#64748b}.choice-label{display:flex;align-items:flex-start;gap:10px;padding:12px;border:1px solid #dbe4f0;border-radius:12px;cursor:pointer}.choice-label:has(input:checked){border-color:#10B981;background:#ecfdf5}
    @media(max-width:640px){.card{border-radius:15px}.topbar .identity{font-size:.82rem}.graph-canvas{height:300px}.matrix{min-width:1430px}.mobile-stack{flex-direction:column;align-items:stretch}.mobile-stack>.btn{width:100%}}
  </style>
</head>
<body>
<div id="app" class="app-shell"></div>
<div id="toastHost" aria-live="polite"></div>
<script>
(()=>{
  'use strict';
  const app=document.getElementById('app');
  const INSTANCE_ID=(new URLSearchParams(window.location.search).get('instanceId')||'default').slice(0,64);
  const KEY='market-equilibrium:'+INSTANCE_ID;
  async function apiFetch(path,options){const res=await fetch(path,options);let body=null;try{body=await res.json()}catch{body=null}if(!res.ok)throw new Error(body&&body.error?body.error:('連線失敗（'+res.status+'），請重試。'));return body}
  function teacherKey(){try{return sessionStorage.getItem(KEY+':teacherKey')||''}catch{return ''}}
  const EQUILIBRIUM_PRICE=50,EQUILIBRIUM_QUANTITY=50;
  const QUESTION_SET=[
    {id:'q1',text:'當市場價格低於均衡價格時，通常會出現哪一種市場狀況？',options:[['a','供過於求'],['b','供不應求（短缺）'],['c','供給量必定等於需求量']],answer:'b'},
    {id:'q2',text:'在短缺情況下，買家互相競爭，市場價格通常會如何變化？',options:[['a','向上調整'],['b','向下調整'],['c','必定維持不變']],answer:'a'},
    {id:'q3',text:'若某物品價格為 0，且取得它不需犧牲其他資源、也不稀缺，這類物品稱為什麼？',options:[['a','經濟物品'],['b','劣等物品'],['c','自由物品']],answer:'c'}
  ];
  let authMode='', identity=null, teacherOn=false, activityId='', records={roster:[],room_events:[],offers:[],trades:[],graph_submissions:[],quiz_submissions:[]};
  let room={stage:1,round:1,roundOpen:true,matrixResetAt:0}, lastStage=0, polling=false, pollTimer=null, userActionBusy=false, pollErrorShown=false, serverVersion=0, refreshTimer=null, eventStream=null;
  let local=readLocal();
  function readLocal(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}
  function writeLocal(){try{localStorage.setItem(KEY,JSON.stringify(local))}catch{toast('本機暫存空間不足，請保留目前頁面並聯絡教師。')}}
  function toast(msg){const host=document.getElementById('toastHost');host.innerHTML='';const el=document.createElement('div');el.className='toast';el.textContent=msg;host.append(el);setTimeout(()=>el.remove(),3200)}
  function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function ts(r){return Number(r?.createdAt||0)}
  function sortNew(a){return [...a].sort((x,y)=>ts(y)-ts(x))}
  function keyOf(d){return `${d.className}|${d.studentNo}`}
  function currentRoster(){const map=new Map();for(const r of sortNew(records.roster||[])){const d=r?.data||{};if(d.className&&d.studentNo&&!map.has(keyOf(d)))map.set(keyOf(d),d)}return [...map.values()]}
  function latestByIdentity(list){const map=new Map();for(const r of sortNew(list)){const d=r.data||{};if(d.identityKey&&!map.has(d.identityKey))map.set(d.identityKey,d)}return map}
  async function postRaw(data){return apiFetch('/api/events',{method:'POST',headers:{'content-type':'application/json',...(teacherKey()?{'x-teacher-key':teacherKey()}:{})},body:JSON.stringify({instanceId:INSTANCE_ID,data})})}
  async function queryAll(){const result=await apiFetch('/api/events?instanceId='+encodeURIComponent(INSTANCE_ID));const items=Array.isArray(result.items)?result.items:[];serverVersion=Number(result.version)||serverVersion;const newestReset=sortNew(items.filter(item=>item?.data?.eventType==='activity_reset'))[0];const newestTagged=sortNew(items.filter(item=>item?.data?.activityId))[0];const nextActivityId=newestReset?.data?.activityId||newestTagged?.data?.activityId||'legacy';const hasGeneration=!!newestReset||!!newestTagged;if(local?.identity&&hasGeneration&&local.activityId!==nextActivityId){localStorage.removeItem(KEY);local={};identity=null;if(!teacherOn){renderLogin();toast('教師已重置課堂活動，請重新登記。')}}activityId=nextActivityId;const activeItems=hasGeneration?items.filter(item=>item?.data?.activityId===activityId):items;records={roster:[],room_events:[],offers:[],trades:[],graph_submissions:[],quiz_submissions:[]};const target={roster:'roster',room:'room_events',matrix_reset:'room_events',activity_reset:'room_events',offers:'offers',trades:'trades',graphs:'graph_submissions',quiz:'quiz_submissions'};for(const item of activeItems){const list=records[target[item?.data?.eventType]];if(list)list.push(item)}applyLatestRoom();return records}
  function applyLatestRoom(){const control=sortNew(records.room_events).find(r=>r.data?.kind==='control');if(control?.data?.state)room={...room,...control.data.state};const reset=sortNew(records.room_events).find(r=>r.data?.kind==='matrix_reset');if(reset)room.matrixResetAt=Math.max(Number(room.matrixResetAt)||0,Number(reset.data?.resetAt)||0)}
  async function saveEvent(eventType,data){await postRaw({...data,eventType,activityId});}
  async function poll(){if(polling)return false;polling=true;try{await queryAll();if(teacherOn)updateTeacher();else if(identity)updateStudent();pollErrorShown=false;return true;}catch(e){const message=e.message||'課堂同步失敗，請檢查連線後重試。';if(!pollErrorShown){toast(message);pollErrorShown=true}return false}finally{polling=false}}
  function scheduleRefresh(){if(refreshTimer)return;refreshTimer=setTimeout(()=>{refreshTimer=null;poll()},250)}
  function setPoll(){try{if(eventStream)eventStream.close();eventStream=new EventSource('/api/stream?instanceId='+encodeURIComponent(INSTANCE_ID));eventStream.onmessage=()=>scheduleRefresh()}catch{}clearInterval(pollTimer);pollTimer=setInterval(()=>poll(),20000)} 
  async function manualRefresh(buttonId){const b=document.getElementById(buttonId);if(!b)return;if(b.disabled)return;b.disabled=true;const original=b.textContent;b.textContent='更新中…';const ok=await poll();if(document.getElementById(buttonId)===b){b.textContent=ok?'已更新':'更新失敗';setTimeout(()=>{if(document.getElementById(buttonId)===b){b.textContent=original;b.disabled=false}},1400)}}
  function latestOffers(){return latestByIdentity(records.offers)}
  function myRoster(){return identity?currentRoster().find(x=>keyOf(x)===keyOf(identity)):null}
  function renderLogin(){identity=null;teacherOn=false;authMode='';app.innerHTML=`<main class="min-h-screen grid place-items-center p-4"><section class="card w-full max-w-xl overflow-hidden"><div class="topbar p-7 sm:p-9"><p class="text-sm font-bold tracking-widest text-blue-100">高中經濟科｜課堂互動</p><h1 class="mt-2 text-3xl sm:text-4xl font-black">市場均衡與供需調整</h1><p class="mt-3 text-blue-100">三階段市場實驗・即時同步</p></div><div class="p-6 sm:p-8"><div id="loginChoice" class="grid sm:grid-cols-2 gap-3"><button class="btn btn-primary" id="studentEntry">學生入口</button><button class="btn btn-green" id="teacherEntry">教師控制台</button></div><div id="loginForm" class="mt-5"></div><p class="text-xs text-slate-500 mt-5">課堂進度跨裝置同步；個人未提交草稿保存在此裝置。</p><p id="connStatus" class="text-sm text-slate-500 mt-3">正在連接課堂資料…</p></div></section></main>`;
    document.getElementById('studentEntry').onclick=()=>showLoginForm('student');document.getElementById('teacherEntry').onclick=()=>showLoginForm('teacher');
    apiFetch('/api/health').then(()=>{document.getElementById('connStatus').textContent='課堂資料已連接。'}).catch(e=>{document.getElementById('connStatus').textContent=(e&&e.message)||'課堂資料連接失敗，請稍後重試。';document.getElementById('connStatus').className='text-sm text-rose-700 mt-3'});
  }
  function showLoginForm(mode){authMode=mode;const box=document.getElementById('loginForm');if(mode==='teacher'){box.innerHTML=`<form id="teacherForm" class="space-y-3"><label class="block text-sm font-bold">教師密碼<input id="teacherPassword" class="field mt-1" type="password" autocomplete="current-password" required></label><div class="flex gap-2"><button class="btn btn-green flex-1">登入教師控制台</button><button type="button" class="btn btn-light" id="cancelLogin">返回</button></div><p id="loginErr" class="text-sm text-rose-700" aria-live="polite"></p></form>`;document.getElementById('teacherForm').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('teacherPassword').value;const btn=e.submitter;if(btn)btn.disabled=true;try{const r=await apiFetch('/api/teacher/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})});if(!r||!r.ok){document.getElementById('loginErr').textContent='密碼不正確。';return}sessionStorage.setItem(KEY+':teacher','1');sessionStorage.setItem(KEY+':teacherKey',pw);teacherOn=true;startTeacher()}catch(err){document.getElementById('loginErr').textContent=(err&&err.message)||'驗證失敗，請重試。'}finally{if(btn)btn.disabled=false}};}
    else{box.innerHTML=`<form id="studentForm" class="space-y-3"><label class="block text-sm font-bold">班別<select id="className" class="field mt-1"><option>高一甲</option><option>高一乙</option></select></label><label class="block text-sm font-bold">學號<input id="studentNo" class="field mt-1" type="number" min="1" max="99" inputmode="numeric" required></label><label class="block text-sm font-bold">姓名<input id="studentName" class="field mt-1" maxlength="24" required></label><div class="flex gap-2"><button class="btn btn-primary flex-1">進入課堂</button><button type="button" class="btn btn-light" id="cancelLogin">返回</button></div><p id="loginErr" class="text-sm text-rose-700" aria-live="polite"></p></form>`;document.getElementById('studentForm').onsubmit=studentLogin;}
    document.getElementById('cancelLogin').onclick=()=>{box.innerHTML='';authMode=''};
  }
  async function studentLogin(e){e.preventDefault();const d={className:document.getElementById('className').value,studentNo:String(Number(document.getElementById('studentNo').value)),name:document.getElementById('studentName').value.trim()};if(!d.name||Number(d.studentNo)<1)return;try{await queryAll();const existing=currentRoster().find(x=>keyOf(x)===keyOf(d));if(existing){if(existing.name!==d.name&&!confirm('此班別與學號已有登記姓名，仍以本次姓名進入嗎？'))return;identity={...existing,name:d.name};}else{const roster=currentRoster();const buyers=roster.filter(x=>x.role==='買家').length,sellers=roster.filter(x=>x.role==='賣家').length;d.role=buyers<=sellers?'買家':'賣家';identity=d;await saveEvent('roster',d);await queryAll()}local.identity=identity;local.activityId=activityId;local.student=local.student||{};writeLocal();startStudent();}catch(err){document.getElementById('loginErr').textContent=err.message||'登記失敗，請重試。'}}
  function startStudent(){teacherOn=false;sessionStorage.removeItem(KEY+':teacher');sessionStorage.removeItem(KEY+':teacherKey');renderStudentShell();updateStudent();setPoll();}
  function startTeacher(){identity=null;renderTeacherShell();poll().then(()=>updateTeacher());setPoll();}
  function logout(){teacherOn=false;identity=null;sessionStorage.removeItem(KEY+':teacher');sessionStorage.removeItem(KEY+':teacherKey');if(eventStream){try{eventStream.close()}catch{}}eventStream=null;if(pollTimer)clearInterval(pollTimer);pollTimer=null;renderLogin()}
  function renderStudentShell(){app.innerHTML=`<header class="topbar sticky top-0 z-20 shadow-md"><div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-2"><div class="identity font-bold" id="studentIdentity"></div><div class="flex gap-2"><button class="btn btn-light !min-h-10 !py-2 !px-3 text-sm" id="studentRefresh">立即更新</button><button class="btn btn-light !min-h-10 !py-2 !px-3 text-sm" id="studentTeacherEntry">教師控制台</button><button class="btn btn-light !min-h-10 !py-2 !px-3 text-sm" id="studentLogout">離開課堂</button></div></div></header><main class="max-w-7xl mx-auto p-4 sm:p-6"><div class="flex flex-wrap items-center justify-between gap-3 mb-5"><div><p class="text-sm text-slate-500">市場實驗室</p><h1 class="text-2xl font-black text-blue-950" id="stageTitle"></h1></div><span class="pill" id="stageBadge"></span></div><section id="studentStage"></section><div id="studentTeacherModal"></div></main>`;document.getElementById('studentLogout').onclick=logout;document.getElementById('studentRefresh').onclick=()=>manualRefresh('studentRefresh');document.getElementById('studentTeacherEntry').onclick=openTeacherFromStudent;}
  function updateStudent(){if(!identity)return;document.getElementById('studentIdentity').textContent=`${identity.className} | ${identity.studentNo}號 ${identity.name} | 角色：${identity.role}`;const s=Number(room.stage||1);document.getElementById('stageTitle').textContent=['','環節 1｜自由競價市場','環節 2｜供需平衡模擬','環節 3｜供需圖判讀'][s]||'課堂活動';document.getElementById('stageBadge').textContent=`教師已開放：環節 ${s}`;if(s!==lastStage){lastStage=s;renderStudentStage(s)}else if(s===1)updateMarketLive();else if(s===2)updateGraphStatus();else if(s===3)updateQuizStatus();}
  function renderStudentStage(stage){const host=document.getElementById('studentStage');if(stage===1)renderMarket(host);else if(stage===2)renderGraphModule(host);else if(stage===3)renderQuiz(host);else host.innerHTML='<div class="card p-6">等待教師開放活動…</div>'}
  function studentDraft(){local.student=local.student||{};local.student[keyOf(identity)]=local.student[keyOf(identity)]||{};return local.student[keyOf(identity)]}
  function renderMarket(host){const dr=studentDraft();host.innerHTML=`<div class="grid lg:grid-cols-[1fr_340px] gap-4"><section class="card p-5 sm:p-6"><div class="flex flex-wrap items-center justify-between gap-2"><h2 class="text-xl font-black text-blue-950">第 ${Number(room.round)||1} 輪競價</h2><span id="roundState" class="pill"></span></div><p class="text-slate-600 mt-2">買價必須高於賣價才可成交。教師結束本輪後，系統先盡量增加成交組數，再按價差由小到大配對；買家與賣家每輪各最多成交一次，成交價採賣家報價。每輪每人提交一次價格。</p><form id="offerForm" class="mt-5 grid sm:grid-cols-[1fr_auto] gap-3 items-end"><label class="text-sm font-bold">${identity.role==='買家'?'買價':'賣價'} P<input id="offerPrice" class="field mt-1" type="number" min="0" step="0.01" inputmode="decimal" placeholder="輸入你的價格" required></label><button id="offerButton" class="btn btn-green" type="submit">提交／更新報價</button></form><p id="offerStatus" class="text-sm text-slate-600 mt-3" aria-live="polite"></p><div class="mt-6"><h3 class="font-bold">本輪成交紀錄</h3><div id="myTrades" class="mt-2 space-y-2"></div></div></section><aside class="card p-5"><h3 class="font-black text-blue-950">本輪市場概況</h3><div class="mt-3 grid grid-cols-2 gap-2 text-center"><div class="rounded-xl bg-blue-50 p-3"><div class="text-xs text-slate-500">買家報價</div><strong id="buyerCount" class="text-xl text-blue-900">0</strong></div><div class="rounded-xl bg-emerald-50 p-3"><div class="text-xs text-slate-500">賣家報價</div><strong id="sellerCount" class="text-xl text-emerald-800">0</strong></div></div><p id="matchMessage" class="mt-4 rounded-xl bg-slate-50 p-3 text-sm text-slate-600"></p></aside></div>`;
    const input=document.getElementById('offerPrice');if(Number.isFinite(Number(dr.offerPrice)))input.value=dr.offerPrice;input.oninput=()=>{dr.offerPrice=input.value;writeLocal()};document.getElementById('offerForm').onsubmit=submitOffer;updateMarketLive();}
  async function submitOffer(e){e.preventDefault();if(userActionBusy)return;const value=Number(document.getElementById('offerPrice').value);if(!Number.isFinite(value)||value<0)return;userActionBusy=true;const button=document.getElementById('offerButton');button.disabled=true;try{const currentOffer=latestOffers().get(keyOf(identity));if(currentOffer&&Number(currentOffer.round)===(Number(room.round)||1)){document.getElementById('offerStatus').textContent='本輪價格已提交，會保留至教師開始新一輪。';return}const state={...identity,identityKey:keyOf(identity),round:Number(room.round)||1,price:value,kind:'offer'};await saveEvent('offers',state);const dr=studentDraft();dr.offerPrice=value;writeLocal();await poll();document.getElementById('offerStatus').textContent='本輪價格已提交；無論是否成交，都會保留至教師開始新一輪。';}catch(err){document.getElementById('offerStatus').textContent=err.message||'提交失敗，請重試。'}finally{userActionBusy=false;if(button)button.disabled=false}}
  function openTeacherFromStudent(){const host=document.getElementById('studentTeacherModal');host.innerHTML=`<div class="modal-backdrop" id="teacherGate"><section class="modal-box max-w-md"><h2 class="text-xl font-black text-blue-950">教師控制台</h2><p class="text-sm text-slate-600 mt-1">請輸入教師密碼以切換至控制台。</p><form id="studentTeacherForm" class="mt-4 space-y-3"><label class="block text-sm font-bold">教師密碼<input id="studentTeacherPassword" class="field mt-1" type="password" autocomplete="current-password" required></label><p id="studentTeacherError" class="text-sm text-rose-700" aria-live="polite"></p><div class="flex gap-2"><button class="btn btn-primary flex-1">驗證並進入</button><button type="button" class="btn btn-light" id="cancelTeacherGate">取消</button></div></form></section></div>`;document.getElementById('cancelTeacherGate').onclick=()=>host.innerHTML='';document.getElementById('teacherGate').onclick=e=>{if(e.target.id==='teacherGate')host.innerHTML=''};document.getElementById('studentTeacherForm').onsubmit=async e=>{e.preventDefault();const pw=document.getElementById('studentTeacherPassword').value;try{const r=await apiFetch('/api/teacher/verify',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw})});if(!r||!r.ok){document.getElementById('studentTeacherError').textContent='密碼不正確。';return}host.innerHTML='';teacherOn=true;identity=null;sessionStorage.setItem(KEY+':teacher','1');sessionStorage.setItem(KEY+':teacherKey',pw);renderTeacherShell();poll().then(()=>updateTeacher());setPoll()}catch(err){document.getElementById('studentTeacherError').textContent=(err&&err.message)||'驗證失敗，請重試。'}}}
  async function settleRound(){const round=Number(room.round)||1;const prior=records.trades.filter(r=>Number(r.data?.round)===round).map(r=>r.data||{});const usedB=new Set(prior.map(t=>t.buyerKey)),usedS=new Set(prior.map(t=>t.sellerKey));const offers=[...latestOffers().values()].filter(o=>Number(o.round)===round);const buyers=offers.filter(o=>o.role==='買家'&&!usedB.has(o.identityKey)).sort((a,b)=>a.identityKey.localeCompare(b.identityKey));const sellers=offers.filter(o=>o.role==='賣家'&&!usedS.has(o.identityKey)).sort((a,b)=>a.identityKey.localeCompare(b.identityKey));

  function drawSupply(canvas,price,compact=false){if(!canvas)return;const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(rect.width*dpr);canvas.height=Math.round(rect.height*dpr);const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const w=rect.width,h=rect.height,pad={l:compact?38:54,r:compact?14:24,t:18,b:compact?34:42};const pw=w-pad.l-pad.r,ph=h-pad.t-pad.b;const X=q=>pad.l+(Number(q)/100)*pw,Y=p=>pad.t+((100-Number(p))/100)*ph;const DEMAND=q=>100-q,SUPPLY=q=>q;const qd=Math.max(0,Math.min(100,100-price)),qs=Math.max(0,Math.min(100,price)),pe=EQUILIBRIUM_PRICE,qe=EQUILIBRIUM_QUANTITY;

    const left=Math.min(qd,qs),right=Math.max(qd,qs);if(Math.abs(qd-qs)>0.4){c.fillStyle=qd>qs?'rgba(239,68,68,.16)':'rgba(245,158,11,.20)';c.fillRect(X(left),Y(price)-7,X(right)-X(left),14)}

"tradeTooltip" class="hidden pointer-events-none absolute z-10 rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white shadow-lg" role="status"></div></div></div><div class="card p-5"><h2 class="font-black text-blue-950">環節 3｜答題正確率與錯項</h2><div id="quizAnalytics" class="mt-4 space-y-4"></div><button id="downloadCsv" class="btn btn-green mt-5">下載全班學習數據 CSV</button></div></section><section class="card p-5 mt-4"><div class="flex flex-wrap items-center justify-between gap-3"><div><h2 class="font-black text-blue-950 text-lg">環節 2｜學生供需圖全檢</h2><p class="text-sm text-slate-600">9 欄 × 4 列，共 36 格；點選縮圖可放大檢視。</p></div><button id="resetMatrix" class="btn btn-danger">重置 9×4 矩陣展示格</button></div><div id="matrixCount" class="mt-3 text-sm text-slate-600"></div><div class="matrix-scroll mt-3"><div id="matrix" class="matrix"></div></div></section><section class="card p-5 mt-4"><h2 class="font-black text-blue-950">即時參與概況</h2><div id="rosterList" class="mt-3 grid sm:grid-cols-2 lg:grid-cols-3 gap-2"></div></section>`;

  async function control(next){setTeacherStatus('正在同步教師控場指令…');try{room={...room,...next};await saveEvent('room',{kind:'control',state:{...room},by:'teacher'});await poll();setTeacherStatus('全班畫面已同步。')}catch(e){setTeacherStatus(e.message||'同步失敗，請重試。')}}
  function setTeacherStatus(t){const el=document.getElementById('teacherStatus');if(el)el.textContent=t}
  async function resetActivity(){if(!confirm('確定重置整個課堂活動？這會清空目前活動的學生名冊、報價、成交、供需圖提交和答題統計，並讓所有學生端回到登入畫面；重置後無法在看板中恢復。'))return;const nextId='act-'+crypto.randomUUID();const initialRoom={stage:1,round:1,roundOpen:true,matrixResetAt:Date.now()};try{setTeacherStatus('正在重置整個活動…');await postRaw({eventType:'activity_reset',activityId:nextId,kind:'control',state:initialRoom,resetAt:Date.now(),by:'teacher'});activityId=nextId;room=initialRoom;records={roster:[],room_events:[],offers:[],trades:[],graph_submissions:[],quiz_submissions:[]};localStorage.removeItem(KEY);const host=document.getElementById('teacherDashboard');if(host)host.dataset.signature='';await poll();setTeacherStatus('整個活動已重置；學生可重新登入。')}catch(e){setTeacherStatus(e.message||'重置活動失敗，請重試。')}}
  async function resetMatrix(){if(!confirm('確定清空目前 9×4（36格）展示？學生既有草稿和原始提交紀錄會保留；重置後的新提交重新展示。'))return;try{const at=Date.now();await saveEvent('matrix_reset',{kind:'matrix_reset',resetAt:at});room.matrixResetAt=at;await poll();toast('矩陣已重置。')}catch(e){toast(e.message||'重置失敗。')}}
  function renderRoster(){const roster=currentRoster().sort((a,b)=>a.className.localeCompare(b.className,'zh-Hant')||Number(a.studentNo)-Number(b.studentNo));const buyers=roster.filter(x=>x.role==='買家').length,sellers=roster.filter(x=>x.role==='賣家').length;document.getElementById('rosterTotal').textContent=roster.length;document.getElementById('roleBalance').textContent=`買家 ${buyers} / 賣家 ${sellers}`;document.getElementById('teacherRound').textContent=`第 ${Number(room.round)||1} 輪・${room.roundOpen?'進行中':'已結束'}`;document.getElementById('balanceNote').textContent=`買家 ${buyers} / 賣家 ${sellers}，系統已自動維持最佳平衡。`;const offers=latestOffers();document.getElementById('rosterList').innerHTML=roster.length?roster.map(x=>{const o=offers.get(keyOf(x));return `<div class="rounded-xl border border-slate-200 p-3 flex items-center justify-between gap-2"><div><b>${esc(x.className)}｜${esc(x.studentNo)}號 ${esc(x.name)}</b><div class="text-xs text-slate-500 mt-1">${esc(x.role)}${o&&Number(o.round)===Number(room.round)?`・本輪報價 ${esc(o.price)}`:''}</div></div><span class="pill ${x.role==='買家'?'':'pill-green'}">${esc(x.role)}</span></div>`}).join(''):'<p class="text-sm text-slate-500">尚無學生登記。</p>'}
  function renderMatrix(){const host=document.getElementById('matrix');if(!host)return;const latest=latestByIdentity(records.graph_submissions.filter(r=>r?.data?.identityKey));const visible=[...latest.values()].filter(d=>Number(d.submittedAt||0)>Number(room.matrixResetAt||0)).sort((a,b)=>Number(b.submittedAt||0)-Number(a.submittedAt||0)).slice(0,36);document.getElementById('matrixCount').textContent=`目前展示 ${visible.length}／36 份提交圖；重置後仍保留的原始資料僅供課堂統計。`;host.innerHTML=Array.from({length:36},(_,i)=>{const d=visible[i];if(!d)return `<div class="matrix-cell flex flex-col justify-center items-center text-slate-400"><span class="text-2xl">${i+1}</span><span class="text-xs">等待提交</span></div>`;return `<button class="matrix-cell text-left hover:border-blue-400 hover:bg-blue-50" data-key="${esc(d.identityKey)}"><div class="font-bold text-xs truncate" title="${esc(d.className)}-${esc(d.studentNo)}-${esc(d.name)}">${esc(d.className)}-${esc(d.studentNo)}號-${esc(d.name)}</div><canvas class="thumb-canvas mt-1" data-price="${Number(d.price)}"></canvas><div class="text-[11px] text-slate-600 mt-1">P ${Number(d.price).toFixed(0)}｜Qd ${Math.max(0,Math.min(100,100-Number(d.price))).toFixed(0)}｜Qs ${Math.max(0,Math.min(100,Number(d.price))).toFixed(0)}</div></button>`}).join('');host.querySelectorAll('canvas').forEach(c=>drawSupply(c,Number(c.dataset.price),true));host.querySelectorAll('button[data-key]').forEach(btn=>btn.onclick=()=>openGraph(btn.dataset.key));}
  function openGraph(identityKey){const sub=sortNew(records.graph_submissions).find(r=>r.data?.identityKey===identityKey&&Number(r.data?.submittedAt||0)>Number(room.matrixResetAt||0));if(!sub)return;const d=sub.data;const modal=document.getElementById('modalHost');modal.innerHTML=`<div class="modal-backdrop" id="modalBackdrop"><section class="modal-box"><div class="flex justify-between gap-3 items-start"><div><h2 class="text-xl font-black text-blue-950">${esc(d.className)}｜${esc(d.studentNo)}號 ${esc(d.name)}</h2><p class="text-sm text-slate-600">價格 P=${Number(d.price).toFixed(0)}；Qd=${Math.max(0,Math.min(100,100-Number(d.price))).toFixed(0)}；Qs=${Math.max(0,Math.min(100,Number(d.price))).toFixed(0)}</p></div><button id="closeModal" class="btn btn-light">關閉</button></div><canvas id="largeGraph" class="graph-canvas mt-3"></canvas></section></div>`;drawSupply(document.getElementById('largeGraph'),Number(d.price));document.getElementById('closeModal').onclick=()=>modal.innerHTML='';document.getElementById('modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')modal.innerHTML=''};}
  function drawBars(canvas,labels,values,color='#2563eb',colors=null){if(!canvas)return;const r=canvas.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=Math.max(220,r.height)*dpr;const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=canvas.height/dpr,p={l:42,r:14,t:15,b:35},pw=w-p.l-p.r,ph=h-p.t-p.b;c.clearRect(0,0,w,h);c.font='11px system-ui';for(let i=0;i<=4;i++){const y=p.t+ph-i*ph/4;c.strokeStyle='#e2e8f0';c.beginPath();c.moveTo(p.l,y);c.lineTo(w-p.r,y);c.stroke();c.fillStyle='#64748b';c.textAlign='right';c.fillText(String(i*25)+'%',p.l-6,y+4)}const bw=Math.min(50,pw/(labels.length*1.8));labels.forEach((lab,i)=>{const x=p.l+(i+.5)*pw/labels.length;const ht=ph*Math.max(0,values[i])/100;c.fillStyle=colors?.[i]||color;c.fillRect(x-bw/2,p.t+ph-ht,bw,ht);c.fillStyle='#334155';c.textAlign='center';c.fillText(`${Math.round(values[i])}%`,x,p.t+ph-ht-5);c.fillText(lab,x,h-10)})}
  function updateTeacherCharts(){if(!teacherOn)return;const tc=document.getElementById('tradeChart');if(tc){const groups=new Map();records.trades.map(r=>r.data||{}).forEach(t=>{const n=Number(t.round)||0;groups.set(n,groups.get(n)||[]);groups.get(n).push(Number(t.price)||0)});const rounds=[...groups.keys()].sort((a,b)=>a-b);drawLineBars(tc,rounds.map(x=>`第${x}輪`),rounds.map(x=>{const a=groups.get(x);return a.reduce((s,n)=>s+n,0)/a.length}),rounds.map(x=>groups.get(x).length))}renderQuizAnalytics()}
  function drawLineBars(canvas,labels,prices,volumes){const r=canvas.getBoundingClientRect();if(!r.width)return;const dpr=Math.min(devicePixelRatio||1,2);canvas.width=r.width*dpr;canvas.height=280*dpr;const c=canvas.getContext('2d');c.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=280,p={l:54,r:18,t:32,b:42},pw=w-p.l-p.r,ph=h-p.t-p.b;c.clearRect(0,0,w,h);const maxPrice=Math.max(10,...prices),yMax=Math.ceil(maxPrice/10)*10||10,priceY=v=>p.t+ph-(v/yMax)*ph;for(let i=0;i<=4;i++){const value=yMax*i/4,y=p.t+ph-i*ph/4;c.strokeStyle='#e2e8f0';c.beginPath();c.moveTo(p.l,y);c.lineTo(w-p.r,y);c.stroke();c.fillStyle='#64748b';c.font='10px system-ui';c.textAlign='right';c.fillText(value.toFixed(yMax<10?1:0),p.l-7,y+4)}const slot=pw/Math.max(1,labels.length),barW=Math.min(44,slot*.48);labels.forEach((lab,i)=>{const x=p.l+slot*(i+.5),y=priceY(prices[i]);c.fillStyle='#1E3A8A';c.fillRect(x-barW/2,y,barW,p.t+ph-y);c.fillStyle='#1e293b';c.font='10px system-ui';c.textAlign='center';c.fillText(lab,x,h-12);c.fillStyle='#059669';c.font='bold 10px system-ui';c.fillText(`成交量 ${volumes[i]}`,x,Math.max(p.t+12,y-7))});c.textAlign='left';c.fillStyle='#1E3A8A';c.font='11px system-ui';c.fillText('藍柱：平均成交價（價格軸依數據調整）',p.l,15);bindTradeChartTooltip(canvas,labels,prices,volumes)}
  function bindTradeChartTooltip(canvas,labels,prices,volumes){canvas.__tradeChartData={labels:[...labels],prices:[...prices],volumes:[...volumes]};if(canvas.__tradeTooltipBound)return;canvas.__tradeTooltipBound=true;const tip=document.getElementById('tradeTooltip'),wrap=document.getElementById('tradeChartWrap');if(!tip||!wrap)return;canvas.addEventListener('pointermove',e=>{const d=canvas.__tradeChartData;if(!d||!d.labels.length)return;const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top,w=rect.width,h=280,p={l:54,r:18,t:32,b:42},pw=w-p.l-p.r,ph=h-p.t-p.b,slot=pw/Math.max(1,d.labels.length),barW=Math.min(44,slot*.48),yMax=Math.ceil(Math.max(10,...d.prices)/10)*10||10;let hit=-1;for(let i=0;i<d.labels.length;i++){const cx=p.l+slot*(i+.5),top=p.t+ph-(d.prices[i]/yMax)*ph;if(x>=cx-barW/2&&x<=cx+barW/2&&y>=top&&y<=p.t+ph){hit=i;break}}if(hit<0){tip.classList.add('hidden');return}tip.textContent=`${d.labels[hit]}｜平均成交價 ${Number(d.prices[hit]).toFixed(2)}｜成交量 ${Number(d.volumes[hit])}`;const wr=wrap.getBoundingClientRect();tip.style.left=`${Math.max(8,Math.min(wr.width-230,e.clientX-wr.left+12))}px`;tip.style.top=`${Math.max(8,Math.min(wr.height-42,e.clientY-wr.top-44))}px`;tip.classList.remove('hidden')});canvas.addEventListener('pointerleave',()=>tip.classList.add('hidden'))}
  function renderQuizAnalytics(){const host=document.getElementById('quizAnalytics');if(!host)return;const quizLatest=latestByIdentity(records.quiz_submissions.filter(r=>r?.data?.identityKey));const submissions=[...quizLatest.values()];host.innerHTML=QUESTION_SET.map((q,i)=>{const total=submissions.length,correct=submissions.filter(s=>s.answers?.[q.id]===q.answer).length;const counts=q.options.map(([v,t])=>({v,t,n:submissions.filter(s=>s.answers?.[q.id]===v).length}));const topWrong=[...counts].filter(x=>x.v!==q.answer).sort((a,b)=>b.n-a.n)[0];return `<div class="rounded-xl border border-slate-200 p-3"><div class="font-bold">第 ${i+1} 題｜${esc(q.text)}</div><div class="text-sm text-slate-600 mt-1">正確率 ${total?Math.round(correct/total*100):0}%（${correct}/${total}）${topWrong&&topWrong.n?`<span class="ml-2 text-rose-700">高頻錯項：${esc(topWrong.t)}（${topWrong.n}人）</span>`:''}</div><canvas class="quizBar w-full h-56 mt-2" data-index="${i}"></canvas></div>`}).join('');host.querySelectorAll('.quizBar').forEach(canvas=>{const q=QUESTION_SET[Number(canvas.dataset.index)],total=submissions.length;const vals=q.options.map(([v])=>total?submissions.filter(s=>s.answers?.[q.id]===v).length/total*100:0);const maxWrong=Math.max(...q.options.filter(([v])=>v!==q.answer).map(([v])=>submissions.filter(s=>s.answers?.[q.id]===v).length));const labels=q.options.map(([v])=>{const count=submissions.filter(s=>s.answers?.[q.id]===v).length;return count===maxWrong&&v!==q.answer&&count>0?'錯項*':v===q.answer?'正確項':'選項'});const colors=q.options.map(([v])=>{const count=submissions.filter(s=>s.answers?.[q.id]===v).length;return v!==q.answer&&count===maxWrong&&count>0?'#ef4444':v===q.answer?'#10B981':'#93c5fd'});drawBars(canvas,labels,vals,'#10B981',colors)})}
  function csvCell(v){let s=String(v??'');if(/[",\n\r]/.test(s))s='"'+s.replace(/"/g,'""')+'"';return s}
  function downloadCsv(){const roster=currentRoster();const trades=records.trades.map(r=>r.data||{}),graphs=records.graph_submissions.map(r=>r.data||{}),quizzes=records.quiz_submissions.map(r=>r.data||{});const headers=['班別','學號','姓名','角色','成交次數','成交均價','成交價格紀錄','環節2提交次數','答題得分'];const rows=roster.map(s=>{const k=keyOf(s),my=trades.filter(t=>t.buyerKey===k||t.sellerKey===k),prices=my.map(t=>Number(t.price)||0),g=graphs.filter(x=>x.identityKey===k).length,lastQuiz=sortNew(records.quiz_submissions).find(r=>r.data?.identityKey===k)?.data;return [s.className,s.studentNo,s.name,s.role,my.length,prices.length?(prices.reduce((a,b)=>a+b,0)/prices.length).toFixed(2):'',prices.join('; '),g,lastQuiz?`${lastQuiz.score}/${lastQuiz.total}`:'']});const csv='\ufeff'+[headers,...rows].map(r=>r.map(csvCell).join(',')).join('\r\n');const blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='市場均衡課堂學習數據.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
  async function initialize(){local=readLocal();const saved=local.identity;if(saved?.className&&saved?.studentNo&&saved?.name&&saved?.role){identity=saved;try{await queryAll();if(sessionStorage.getItem(KEY+':teacher')==='1'&&teacherKey()){teacherOn=true;identity=null;startTeacher();return}const registered=myRoster();if(registered)identity={...saved,...registered};local.identity=identity;local.activityId=activityId;writeLocal();startStudent();return}catch(e){renderLogin();return}}if(sessionStorage.getItem(KEY+':teacher')==='1'&&teacherKey()){teacherOn=true;startTeacher();return}renderLogin()}
  initialize();
})();
